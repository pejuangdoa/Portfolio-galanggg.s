<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri Prestasi</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #021f35;
        color: white;
        padding: 40px;
    }

    h1 {
        text-align: center;
        margin-bottom: 40px;
        font-size: 42px;
    }

    h1 span {
        color: #00ffb3;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 25px;
    }

    .card {
        background: #0b3048;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(0,255,179,0.2);
        cursor: pointer;
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-8px);
    }

    .card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
    }

    .card h3 {
        text-align: center;
        padding: 18px;
        font-size: 24px;
    }

    /* Modal */
    .modal {
        display: none;
        position: fixed;
        z-index: 999;
        padding-top: 50px;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.9);
    }

    .modal-content {
        margin: auto;
        display: block;
        width: 80%;
        max-width: 900px;
        border-radius: 12px;
        animation: zoom 0.3s;
    }

    @keyframes zoom {
        from {transform: scale(0.7);}
        to {transform: scale(1);}
    }

    .close {
        position: absolute;
        top: 20px;
        right: 40px;
        color: white;
        font-size: 45px;
        font-weight: bold;
        cursor: pointer;
    }

    #caption {
        text-align: center;
        color: white;
        margin-top: 20px;
        font-size: 22px;
    }

    @media(max-width: 768px){
        .modal-content {
            width: 95%;
        }
    }
</style>
</head>
<body>

    <h1>Prestasi <span>Saya</span></h1>

    <div class="gallery">

        <div class="card">
            <img src="../assets/gamebg1.jpeg" alt="Juara 1 Lomba Web Design">
            <h3>Juara 1 Web Design</h3>
        </div>

        <div class="card">
            <img src="../assets/me12.jpeg" alt="Sertifikat Seminar Nasional">
            <h3>Seminar Nasional</h3>
        </div>

        <div class="card">
            <img src="../assets/me4.jpg" alt="Sertifikat Coding Competition">
            <h3>Coding Competition</h3>
        </div>

        <div class="card">
            <img src="../assets/me4.jpg" alt="Pelatihan UI UX">
            <h3>Pelatihan UI/UX</h3>
        </div>

    </div>

    <!-- Modal -->
    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="imgModal">
        <div id="caption"></div>
    </div>

<script>
    let modal = document.getElementById("myModal");
    let modalImg = document.getElementById("imgModal");
    let captionText = document.getElementById("caption");
    let cards = document.querySelectorAll(".card img");
    let closeBtn = document.querySelector(".close");

    cards.forEach(img => {
        img.onclick = function(){
            modal.style.display = "block";
            modalImg.src = this.src;
            captionText.innerHTML = this.alt;
        }
    });

    closeBtn.onclick = function() {
        modal.style.display = "none";
    }

    modal.onclick = function(e){
        if(e.target === modal){
            modal.style.display = "none";
        }
    }
</script>

</body>
</html>
